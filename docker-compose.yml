name: webhook-gateway

x-app: &app
  build: .
  environment: &app-env
    WG_DATABASE_URL: postgresql+asyncpg://webhooks:webhooks@postgres:5432/webhooks
    WG_LOG_LEVEL: INFO
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 2s
      timeout: 3s
      retries: 30

  # runs once and exits
  migrate:
    build: .
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["python", "-m", "webhook_gateway.api.main"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: ["python", "-m", "webhook_gateway.worker.main"]
    deploy:
      replicas: 2
    stop_signal: SIGTERM
    stop_grace_period: 40s  # > WG_WORKER_SHUTDOWN_GRACE_S (30s)

volumes:
  pgdata:
